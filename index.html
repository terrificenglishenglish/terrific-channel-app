<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrific.eng App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width column; pink test card on top, then free rubrics as accordions, paid courses, locked club tiles */
:root{
  --bg:#fbf6f8; --surface:#ffffff; --ink:#24131c; --muted:#7a6470; --line:#eedde5;
  --pink:#fd1796; --pink-soft:#ffe3f1; --pink-ink:#b3005f; --ok:#1f9d6b; --bad:#d4334a;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150b11; --surface:#21131b; --ink:#fbeef4; --muted:#b799a8; --line:#3a2330;
  --pink:#ff3aa6; --pink-soft:#3a1229; --pink-ink:#ff8fca; --ok:#45d39b; --bad:#ff6b80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150b11; --surface:#21131b; --ink:#fbeef4; --muted:#b799a8; --line:#3a2330;
  --pink:#ff3aa6; --pink-soft:#3a1229; --pink-ink:#ff8fca; --ok:#45d39b; --bad:#ff6b80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:520px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;background:var(--pink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* test hero */
.hero{background:var(--pink);color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero h2{font-size:26px;font-weight:800;line-height:1.1}
.hero p{margin:0;opacity:.92}
.scale{display:flex;gap:6px}
.scale span{flex:1;text-align:center;font-family:var(--display);font-size:12px;font-weight:700;padding:7px 0;border-radius:10px;background:rgba(255,255,255,.18)}
.scale span.on{background:#fff;color:var(--pink)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:15px;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px}
.btn-white{background:#fff;color:#b3005f}
.btn-pink{background:var(--pink);color:#fff}
.btn-ghost{background:var(--pink-soft);color:var(--pink-ink)}
.hero .last{font-size:13px;opacity:.9}

/* sections */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{font-size:17px;font-weight:700}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--pink-soft);color:var(--pink-ink);white-space:nowrap}

/* accordions */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.acc-btn{width:100%;background:none;border:0;display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left}
.acc-ico{width:38px;height:38px;border-radius:12px;background:var(--pink-soft);display:grid;place-items:center;font-size:19px;flex:none}
.acc-t{flex:1;min-width:0}
.acc-t b{display:block;font-size:15px}
.acc-t small{color:var(--muted);font-size:13px}
.chev{width:22px;height:22px;flex:none;transition:transform .2s;color:var(--muted)}
.acc.open .chev{transform:rotate(90deg);color:var(--pink)}
.acc-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.acc-list a,.acc-list .soon{display:flex;align-items:center;gap:10px;padding:13px 16px 13px 66px;text-decoration:none;border-top:1px solid var(--line)}
.acc-list > :first-child{border-top:0}
.acc-list a:hover{background:var(--pink-soft)}
.acc-list .t{flex:1;min-width:0}
.acc-list .arrow{color:var(--pink);font-weight:700}
.acc-list .soon{color:var(--muted)}
.acc-list .soon em{font-style:normal;font-size:12px}

/* courses */
.course{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.course.feat{border:2px solid var(--pink)}
.c-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.course h3{font-size:15px;font-weight:700;line-height:1.25}
.price{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;color:var(--pink-ink)}
.price small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);text-align:right}
.course p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.steps b{font-weight:600}

/* locked */
.locked{background:var(--surface);border:1px dashed var(--pink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.sub{font-size:13px;color:var(--muted);margin-top:-6px}
.teacher{background:var(--bg);border-radius:12px;padding:12px 12px 12px 14px;font-size:14px}
.teacher h4{margin:0 0 6px;font-family:var(--display);font-size:12px;font-weight:700;color:var(--pink-ink);letter-spacing:.02em}
.teacher ul,.more>ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.folds{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:6px}
.folds .more-btn{width:100%;justify-content:space-between;padding:8px 0}
.brand{display:flex;justify-content:center}
.logo{width:132px;height:auto}
.hero .who{display:flex;align-items:center;gap:14px}
.ava{width:72px;height:72px;border-radius:50%;border:3px solid #fff;flex:none;object-fit:cover}
.hero h1{font-size:22px;font-weight:800;line-height:1.15;letter-spacing:.01em}
.subs{font-size:13px;opacity:.9;margin-top:4px}
.testcard{background:var(--surface);border:2px solid var(--pink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.testcard h3{font-size:17px;font-weight:700;line-height:1.25}
.testcard p{margin:0;color:var(--muted);font-size:14px}
.testcard .scale span{background:var(--pink-soft);color:var(--pink-ink)}
.testcard .scale span.on{background:var(--pink);color:#fff}
.testcard .last{font-size:13px;color:var(--muted)}
.club{background:var(--surface);border:2px solid var(--pink);border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.club h3{font-size:17px;font-weight:700;line-height:1.35;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.club .big-t{font-size:21px;font-weight:800;line-height:1.2}
.club .sub-t{font-size:14px;font-weight:600;margin-top:-6px}
.club p{margin:0;color:var(--muted);font-size:14px}
.soon-b{display:inline-block;vertical-align:middle;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--ink);color:var(--surface);margin-left:4px}
.btn-off{background:var(--line);color:var(--muted);cursor:not-allowed}
.lead{font-weight:700;font-size:15px}
.lvls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lvls-l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-right:2px}
.lvl{font-family:var(--display);font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--pink);color:#fff;white-space:nowrap}
.lock-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lock-grid div{background:var(--bg);border-radius:12px;padding:11px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.lock-grid div:last-child:nth-child(odd){grid-column:1 / -1}
.lock-grid div::before{content:"🔒";font-size:12px}

.foot{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;color:var(--muted);font-size:13px}

/* test screen */
.qhead{display:flex;align-items:center;gap:12px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);transition:width .25s}
.qnum{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.qlevel{align-self:flex-start}
.qtext{font-size:19px;font-weight:600;line-height:1.35}
.qtext .gap{display:inline-block;min-width:64px;border-bottom:2px solid var(--pink);margin:0 2px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;font-size:16px;font-weight:500;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--pink)}
.opt.picked{border-color:var(--pink);background:var(--pink-soft)}
.hint{font-size:13px;color:var(--muted);text-align:center}

/* result */
.res{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;gap:16px;text-align:center}
.big{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;color:var(--pink)}
.res .name{font-weight:700;font-size:17px}
.res p{margin:0;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.ladder div{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.ladder i{display:block;height:46px;border-radius:10px;background:var(--line);position:relative;overflow:hidden}
.ladder i b{position:absolute;inset:auto 0 0 0;background:var(--pink);opacity:.85}
.ladder .me{color:var(--pink-ink)}
.ladder .me i{outline:2px solid var(--pink);outline-offset:2px}
.rec{display:flex;flex-direction:column;gap:10px;text-align:left}
.row-btns{display:flex;flex-direction:column;gap:8px}
.more-btn{background:none;border:0;padding:4px 0;display:flex;align-items:center;gap:6px;color:var(--pink-ink);font-weight:600;font-size:14px;align-self:flex-start}
.more-btn .chev{width:18px;height:18px;color:var(--pink-ink)}
.more-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.more{display:flex;flex-direction:column;gap:14px;font-size:14px}
.more h4{margin:0 0 6px;font-family:var(--display);font-size:13px;font-weight:700}
.more ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.feat-list{display:flex;flex-direction:column;gap:8px}
.feat-list div{display:flex;gap:10px}
.feat-list b{display:block}
.feat-list span.e{font-size:18px;line-height:1.2}
.feat-list p{margin:0;color:var(--muted);font-size:13px}
.sched{display:flex;flex-direction:column;gap:6px}
.sched div{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--bg)}
.sched .lv{font-family:var(--display);font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--pink);color:#fff;white-space:nowrap}
.sched small{grid-column:2;color:var(--muted)}
.sched .st{grid-row:1 / span 2;grid-column:3;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.st.yes{background:var(--pink-soft);color:var(--ok)}
.st.no{background:var(--line);color:var(--muted)}
.howto{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.howto div{display:flex;gap:10px}
.howto div::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.howto p{margin:2px 0 0;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

    ${c.sub?`<div class="sub">${esc(c.sub)}</div>`:""}
    ${c.lead?`<div class="lead">${esc(c.lead)}</div>`:""}
    ${c.text?`<p>${esc(c.text)}</p>`:""}
    ${c.teacher?`<div class="folds">
      <button class="more-btn" aria-expanded="false" id="t-${c.id}">О преподавателе ${chev}</button>
      <div class="teacher" hidden><ul>${c.teacher.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <button class="more-btn" aria-expanded="false" id="i-${c.id}">${esc(c.info.label)} ${chev}</button>
      <div class="teacher" hidden><ul>${c.info.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>`:""}
    ${c.levels?`<div class="lvls"><span class="lvls-l">Уровни</span>${c.levels.map(x=>`<span class="lvl">${esc(x)}</span>`).join("")}</div>`:""}
    ${c.inside?`<button class="more-btn" aria-expanded="false" id="in-${c.id}">Подробнее: что внутри ${chev}</button>
    <div class="lock-grid" hidden>${c.inside.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`:""}
    ${c.chips?`<div class="chips">${c.chips.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}
    ${c.steps?`<div class="steps">${c.steps.map(s=>`<div><span>${s[0]}</span><b>${s[1]}</b></div>`).join("")}</div>`:""}
    ${c.more?`<button class="more-btn" aria-expanded="false" id="more-${c.id}">Подробнее о клубе ${chev}</button>
    <div class="more" hidden>
      <div><h4>Для кого</h4><ul>${c.more.who.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div><h4>Что внутри</h4><div class="feat-list">${c.more.inside.map(f=>`<div><span class="e">${f[0]}</span><span><b>${esc(f[1])}</b><p>${esc(f[2])}</p></span></div>`).join("")}</div></div>
      <div><h4>Расписание</h4><div class="sched">${c.more.schedule.map(s=>`<div><span class="lv">${s[0]}</span><span>${s[1]}</span><span class="st ${s[3]?"yes":"no"}">${s[3]?"есть места":"мест нет"}</span><small>${esc(s[2])}</small></div>`).join("")}</div></div>
      <div><h4>Как попасть в группу</h4><div class="howto">${c.more.howto.map(h=>`<div><span><b>${esc(h[0])}</b><p>${esc(h[1])}</p></span></div>`).join("")}</div></div>
    </div>`:""}
    ${c.soon?`<button class="btn btn-off" disabled aria-disabled="true">${esc(c.btn)}</button>`:`<a class="btn ${c.feat||c.more||c.teacher?"btn-pink":"btn-ghost"}" href="${esc(c.link())}" target="_blank" rel="noopener">${esc(c.btn)}</a>`}
    ${c.btn2?`<a class="btn btn-ghost" href="${esc(c.link2())}" target="_blank" rel="noopener">${esc(c.btn2)}</a>`:""}
  </article>`;
}
function bindMore(){
  app.querySelectorAll(".more-btn").forEach(b=>b.onclick=()=>{
    const box=b.nextElementSibling, open=box.hidden; box.hidden=!open; b.setAttribute("aria-expanded",open);
  });
}
function home(){
  const last = store.get("te-result");
  app.innerHTML = `
  <section class="hero">
    <div class="who">
      <img class="ava" src="${AVA}" alt="Анастасия" width="128" height="128">
      <div><h1>TERRIFIC ENGLISH<br>CHANNEL</h1></div>
    </div>
    <p>Здесь настоящий английский. Прокачаю твой уровень с помощью фильмов, сериалов и книг</p>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Бесплатно в канале</h2><span class="tag">открыто всем</span></div>
    <div class="testcard">
      <div class="eyebrow">Бесплатно · 60 вопросов · 15 минут</div>
      <h3>🎯 Узнайте свой уровень английского</h3>
      <p>Грамматика и лексика от A1 до C2. В конце покажу ваш уровень и подскажу дальнейшие шаги, чтобы прокачать английский.</p>
      <div class="scale">${LEVELS.map(l=>`<span class="${last&&last.level===l?"on":""}">${l}</span>`).join("")}</div>
      <button class="btn btn-pink" id="startTest">${last?"Пройти тест ещё раз":"Пройти тест"}</button>
      ${last?`<div class="last">Ваш прошлый результат: <b>${last.level}</b>, ${last.score} из 60</div>`:""}
    </div>
    ${RUBRICS.map((r,i)=>`
      <div class="acc${openAcc.has(i)?" open":""}" data-i="${i}">
        <button class="acc-btn" aria-expanded="${openAcc.has(i)}" id="acc-${i}">
          <span class="acc-ico">${r.icon}</span>
          <span class="acc-t"><b>${esc(r.title)}</b><small>${esc(r.sub)} · ${r.items.length}</small></span>${chev}
        </button>
        <div class="acc-list" ${openAcc.has(i)?"":"hidden"}>
          ${r.items.map(it=> it.link
            ? `<a href="${esc(it.link)}" target="_blank" rel="noopener"><span class="t">${esc(it.t)}</span><span class="arrow">→</span></a>`
            : `<div class="soon"><span class="t">${esc(it.t)}</span><em>скоро</em></div>`).join("")}
        </div>
      </div>`).join("")}
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Курсы и занятия</h2></div>
    ${COURSES.map(courseCard).join("")}
  </section>


  <footer class="foot">
    <a class="btn btn-ghost" href="${esc(dm("Здравствуйте! У меня вопрос"))}" target="_blank" rel="noopener">✉️ Задать вопрос</a>
    <span>Сайт: <a href="${CONFIG.site}" target="_blank" rel="noopener">terrific-eng.ru</a></span>
  </footer>`;
  document.getElementById("startTest").onclick = startTest;
  bindMore();
  app.querySelectorAll(".acc-btn").forEach(b=>b.onclick=()=>{
    const box=b.parentElement, i=+box.dataset.i, list=box.querySelector(".acc-list");
    const open=!box.classList.contains("open"); box.classList.toggle("open",open); list.hidden=!open; b.setAttribute("aria-expanded",open);
    open?openAcc.add(i):openAcc.delete(i);

}

/* ============ ТЕСТ ============ */
let qi=0, answers=[];
function startTest(){ qi=0; answers=[]; question(); window.scrollTo(0,0); }
function question(){
  const [lvl,text,opts,,kind] = Q[qi];
  const html = esc(text).replace("___",'<span class="gap"></span>');
  app.innerHTML = `
  <div class="qhead">
    <button class="back" id="qBack" aria-label="Назад">←</button>
    <div class="bar"><i style="width:${qi/Q.length*100}%"></i></div>
    <div class="qnum">${qi+1} / ${Q.length}</div>
  </div>
  <div class="qcard">
    <span class="tag qlevel">${kind==="v"?"Vocabulary":"Grammar"} · choose the correct option</span>
    <div class="qtext">${html}</div>
    <div class="opts">${opts.map((o,k)=>`<button class="opt${answers[qi]===k?" picked":""}" data-k="${k}" id="opt-${k}">${esc(o)}</button>`).join("")}</div>
  </div>
  <p class="hint">Не знаете ответ? Не угадывайте: выберите вариант, который кажется верным, тест сам подстроится под результат.</p>`;
  document.getElementById("qBack").onclick=()=>{ if(qi===0) home(); else { qi--; question(); } };
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    answers[qi]=+b.dataset.k; b.classList.add("picked");
    try{ tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); }catch(e){}
    setTimeout(()=>{ qi++; qi<Q.length?question():result(); },220);
  });
}
function grade(){
  const per = Object.fromEntries(LEVELS.map(l=>[l,0])); let score=0;
  Q.forEach((q,i)=>{ if(answers[i]===q[3]){ per[q[0]]++; score++; } });
  // уровень = последний, где 6+ из 10 и все ниже тоже 6+ (с одной поблажкой)
  let level="A1", slips=0;
  for(const l of LEVELS){ if(per[l]>=6) level=l; else if(per[l]===5 && slips===0){ slips++; } else break; }
  return {score, per, level};
}
/* Разговорный клуб: какая группа подойдёт по результату теста */
function clubGroup(r){
  if(r.level==="A1"||r.level==="A2"||r.level==="C2") return null;
  if(r.level==="B1") return "B1+ / B2";
  if(r.level==="B2") return (r.per.B2>=8 || r.per.C1>=5) ? "B2+ / C1" : "B1+ / B2";
  return "B2+ / C1";
}
function clubBlock(r){
  const sp = COURSES.find(c=>c.id==="speaking");
  const g = clubGroup(r);
  if(!g) return "";
  const who = g==="B1+ / B2" ? "для тех, у кого любой B1 или начальный B2" : "для тех, у кого B2 или начальный C1";
  const slots = sp.more.schedule.filter(s=>s[0]===g);
  return `<section class="club">
    <h3 class="big-t">Вам подойдёт группа <span class="lvl">${g}</span></h3>
    <p>Разговорный клуб Terrific Speaking. Группа ${esc(who)}. Точно подтвердим на бесплатном 10-минутном интервью с Анастасией.</p>
    <div class="sched">${slots.map(s=>`<div><span class="lv">${s[0]}</span><span>${s[1]}</span><span class="st ${s[3]?"yes":"no"}">${s[3]?"есть места":"мест нет"}</span><small>${esc(s[2])}</small></div>`).join("")}</div>
    <div class="steps">${sp.steps.map(s=>`<div><span>${s[0]}</span><b>${s[1]}</b></div>`).join("")}</div>
    <button class="btn btn-pink" id="toClub">Узнать больше</button>
  </section>`;
}
function communityBlock(r){
  if(!COMMUNITY_FOR.includes(r.level)) return "";
  const c = COURSES.find(x=>x.id==="daily");
  return `<section class="club">
    <h3 class="big-t">TERRIFIC COMMUNITY <span class="soon-b">скоро</span></h3>
    <div class="sub-t">Английский каждый день в закрытом канале · ${c.price} в месяц</div>
    <div class="lvls"><span class="lvls-l">Ваш уровень</span><span class="lvl">${DAILY_LEVEL[r.level]}</span></div>
    <p>${esc(c.text)}</p>
    <button class="btn btn-pink" id="toCommunity">Узнать больше</button>
  </section>`;
}
/* открыть главную на карточке TERRIFIC COMMUNITY с раскрытым «что внутри» */
function showCommunity(){ showCourse("daily"); }
function showCourse(id){
  home();
  const card=document.getElementById("c-"+id); if(!card) return;
  const btn=card.querySelector(".more-btn"); if(btn && btn.getAttribute("aria-expanded")!=="true") btn.click();
  card.scrollIntoView({block:"start"});
}
function result(){
  const r = grade(); store.set("te-result",{level:r.level,score:r.score});
  const info = LEVEL_INFO[r.level];
  const recs = RECS[r.level].map(id=>COURSES.find(c=>c.id===id));
  const extra = !!(clubGroup(r) || COMMUNITY_FOR.includes(r.level));
  const shareText = `Мой уровень английского по тесту terrific.eng: ${r.level} (${info.name})! Проверь свой:`;
  const share = `https://t.me/share/url?url=${encodeURIComponent(CONFIG.appLink)}&text=${encodeURIComponent(shareText)}`;
  app.innerHTML = `
  <div class="qhead"><button class="back" id="rBack" aria-label="На главную">←</button><div class="eyebrow">Ваш результат</div></div>
  <section class="res">
    <div class="big">${r.level}</div>
    <div class="name">${info.name} · ${r.score} из 60</div>
    <p>${info.text}</p>
    <div class="ladder">${LEVELS.map(l=>`<div class="${l===r.level?"me":""}"><i><b style="height:${r.per[l]/10*100}%"></b></i>${l}<span style="font-weight:500">${r.per[l]}/10</span></div>`).join("")}</div>
    <div class="row-btns">
      <a class="btn btn-pink" href="${esc(share)}" target="_blank" rel="noopener">Поделиться результатом</a>
      <button class="btn btn-ghost" id="again">Пройти ещё раз</button>
    </div>
  </section>
  ${clubBlock(r)}
  ${communityBlock(r)}
  <section class="sec">
    <div class="sec-head"><h2>${extra?"Что ещё вам подойдёт":"Вам подойдёт"}</h2></div>
    <div class="rec">${recs.map(courseCard).join("")}</div>
  </section>`;
  document.getElementById("rBack").onclick=()=>{home();window.scrollTo(0,0)};
  document.getElementById("again").onclick=startTest;
  const tc=document.getElementById("toCommunity"); if(tc) tc.onclick=showCommunity;
  const tk=document.getElementById("toClub"); if(tk) tk.onclick=()=>showCourse("speaking");
  bindMore();
  window.scrollTo(0,0);
}
home();
</script>
