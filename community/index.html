<style>
  :root{
    --bg: var(--tg-theme-bg-color, #fbf8f4);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1d1a17);
    --muted: var(--tg-theme-hint-color, #8a8178);
    --accent: #fd1796;
    --accent-2: #ff6cbf;
    --ok: #2f9e6b;
    --bad: #d6453d;
    --line: rgba(127,127,127,.18);
    --radius: 18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;}
  body{min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  .hero{background:radial-gradient(120% 90% at 100% 0%,#5a0a38 0%,#1a0b14 60%);color:#fff;border-radius:24px;padding:22px 20px;margin-bottom:18px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(253,23,150,.25);filter:blur(10px)}
  .hero .logo{display:block;width:150px;height:auto;margin:0 auto 10px;position:relative;z-index:1}
  .hero > *{position:relative;z-index:1}
  .hero.center{text-align:center}
  .badge{background:rgba(253,23,150,.35)!important}
  .hero small{opacity:.9;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
  .hero h1{margin:6px 0 4px;font-size:24px;line-height:1.2}
  .hero p{margin:0;opacity:.95;font-size:14px}
  .badge{display:inline-block;margin-top:12px;background:rgba(255,255,255,.22);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
  h2{font-size:18px;margin:22px 0 10px}
  .grid{display:grid;gap:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .12s}
  .tile:active{transform:scale(.98)}
  .tile.big{background:linear-gradient(135deg,#fd1796,#c20f72);color:#fff;border:0}
  .tile.big p{color:rgba(255,255,255,.8)}
  .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
  .tile h3{margin:0 0 3px;font-size:16px}
  .tile p{margin:0;color:var(--muted);font-size:13px}
  .tile .arrow{margin-left:auto;color:var(--muted);font-size:20px}
  .tile.big .arrow{color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .muted{color:var(--muted)}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:15px;background:var(--accent);color:#fff;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn.dark{background:linear-gradient(135deg,#fd1796,#c20f72)}
  .progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 16px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
  .q{font-size:18px;font-weight:700;line-height:1.4;margin:6px 0 16px}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;font-size:15px;cursor:pointer}
  .result{text-align:center;padding:26px 16px}
  .level{font-size:64px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .back{display:block;background:none;border:0;color:var(--accent);font:inherit;font-weight:700;padding:0;margin-bottom:14px;cursor:pointer}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(127,127,127,.12);color:var(--muted);margin-right:6px}
  .lvl{font-weight:800;font-size:15px;flex:none;width:64px;height:48px;border-radius:14px;display:grid;place-items:center}
  .item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:0}
  .item .play{width:38px;height:38px;border-radius:50%;background:rgba(253,23,150,.12);color:var(--accent);display:grid;place-items:center;flex:none;font-size:14px}
  .item b{font-size:15px;display:block}
  .item small{color:var(--muted);font-size:12px}
  .item.soon{opacity:.5;cursor:default}
  ul.list{padding-left:20px;margin:8px 0}
  ul.list li{margin:6px 0}
  .grp{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .grp:last-child{border-bottom:0}
  .grp b{display:block;font-size:15px}
  .grp small{color:var(--muted);font-size:13px;display:block;margin-top:2px}
  .pill{flex:none;align-self:center;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(47,158,107,.14);color:var(--ok);white-space:nowrap}
  .pill.full{background:rgba(127,127,127,.14);color:var(--muted)}
  .step{display:flex;gap:12px;padding:10px 0}
  .step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
  .step p{margin:3px 0 0;color:var(--muted);font-size:14px}
  .price{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  .price:last-child{border-bottom:0}
  .price b{color:var(--accent)}
  .fc{perspective:1000px;margin:6px 0 14px;cursor:pointer}
  .fc-in{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
  .fc.flip .fc-in{transform:rotateY(180deg)}
  .fc.flip .fc-f,.fc:not(.flip) .fc-b{pointer-events:none}
  .fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .fc-f{background:linear-gradient(135deg,#fd1796,#c20f72);color:#fff}
  .fc-b{background:var(--card);border:1.5px solid var(--line);transform:rotateY(180deg)}
  .fc-w{font-size:26px;font-weight:800;line-height:1.2}
  .fc-h{font-size:12px;opacity:.8;margin-top:14px}
  .fc-t{font-size:20px;font-weight:700;margin-bottom:14px}
  .fc-e{font-size:15px;color:var(--muted);line-height:1.5}
  .gap{display:inline-block;min-width:70px;border-bottom:2px dashed var(--accent);color:var(--accent);font-weight:700;cursor:pointer}
  .say{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;margin-top:16px;cursor:pointer}
  .row2{display:flex;gap:10px}.row2 .btn{margin-top:0}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:4px 0 14px}
  .seg button{flex:1;border:0;background:none;font:inherit;font-weight:700;padding:10px;border-radius:10px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .stat{display:flex;gap:12px}.stat .card{flex:1;text-align:center}
  .stat b{display:block;font-size:30px;color:var(--accent)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>

const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
if (tg) { tg.ready(); tg.expand(); }
const haptic = t => { try{ if(!tg||!tg.HapticFeedback) return; t ? tg.HapticFeedback.notificationOccurred(t) : tg.HapticFeedback.impactOccurred("light"); }catch(e){} };

const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("te_progress")||"{}"); }catch(e){ return {}; } },
  set(k,v){ try{ const s=this.get(); s[k]=v; localStorage.setItem("te_progress",JSON.stringify(s)); }catch(e){} }
};

function openLink(url){
  if(!url || url==="https://t.me/") { try{ tg && tg.showAlert ? tg.showAlert("Ссылка скоро появится 🙂") : alert("Ссылка скоро появится 🙂"); }catch(e){} return; }
  haptic();
  try{
    if(inTelegram && /^https:\/\/t\.me\//.test(url)) { tg.openTelegramLink(url); return; }
    if(inTelegram) { tg.openLink(url); return; }
  }catch(e){}
  window.open(url, "_blank");
}

const app = document.getElementById("app");
const stack = [];
function go(view){ haptic(); stack.push(view); render(); window.scrollTo(0,0); }
function back(){ stack.pop(); if(!stack.length) stack.push({name:"home"}); render(); window.scrollTo(0,0); }
function home(){ stack.length=0; stack.push({name:"home"}); render(); window.scrollTo(0,0); }
const cur = () => stack[stack.length-1];
if (tg && tg.BackButton) tg.BackButton.onClick(back);

function grammarLink(g){
  if(g.link) return g.link;
  const mats = MATERIALS.filter(m=>m.level===g.level).sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  const m = mats[g.week-1]; if(!m) return "";
  const key=s=>String(s).trim().toLowerCase();
  const r = PARTS.find(x=>x.level===g.level && key(x.title)===key(m.title) && x.part===3);
  return r && r.link ? r.link : "";
}

/* ---------- Карточки и прогресс ---------- */
let CUR = WEEKS[WEEKS.length-1];
const ckey = (w,l) => "k_"+w+"_"+l;
function known(w,l){ return store.get()[ckey(w,l)]||[]; }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function markActive(){ const days=store.get().days||[]; const t=today(); if(!days.includes(t)){ days.push(t); store.set("days",days.slice(-400)); } }
function streak(){
  const days=new Set(store.get().days||[]); let n=0; const d=new Date();
  if(!days.has(today())) d.setDate(d.getDate()-1);
  while(true){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(days.has(k)){n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}
function totalKnown(){ let n=0; WEEKS.forEach(w=>Object.keys(w.levels).forEach(l=>n+=known(w.n,l).length)); return n; }
function weeksDone(){ let n=0; WEEKS.forEach(w=>Object.entries(w.levels).forEach(([l,x])=>{ if(known(w.n,l).length>=x.words.length) n++; })); return n; }
function progressLine(){ const s=streak(); return (s?`🔥 ${s} ${s===1?"день":s<5?"дня":"дней"} подряд · `:"")+`выучено слов: ${totalKnown()}`; }
const gapHtml = e => esc(e).replace(/\[\[(.*?)\]\]/g,(m,x)=>`<span class="gap" data-a="${x}" onclick="event.stopPropagation();this.textContent=this.dataset.a">______</span>`);
function say(t){ try{ const u=new SpeechSynthesisUtterance(t.replace("…","")); u.lang="en-GB"; u.rate=.9; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }

function resetLevel(l){ store.set(ckey(CUR.n,l),[]); render(); }
function startDeck(l,a,b){
  const x=CUR.levels[l], kn=known(CUR.n,l);
  let q=x.words.slice(a,b).filter(w=>!kn.includes(w[0]));
  if(!q.length) q=x.words.slice(a,b);   // всё выучено — повторяем всё
  q=q.map(w=>w).sort(()=>Math.random()-.5);
  go({name:"deck",level:l,q,total:q.length,done:0,flip:false});
}
function renderDeck(v){
  if(!v.q.length){
    app.innerHTML = `<div class="card result"><div style="font-size:52px">🎉</div><h3>Отлично!</h3><p class="muted">Вы прошли все карточки</p></div>
      <button class="btn" onclick="back()">К выбору частей</button><button class="back" style="display:block;margin:16px auto 0" onclick="home()">В главное меню</button>`;
    return;
  }
  const [w,t,e]=v.q[0];
  const sayBtn = `<button class="say" onclick="event.stopPropagation();say(${JSON.stringify(w).replace(/"/g,"&quot;")})">🔊 Послушать</button>`;
  const filled = esc(e).replace(/\[\[(.*?)\]\]/g,(m,x)=>`<b style="color:var(--accent)">${x}</b>`);
  const blank = esc(e).replace(/\[\[(.*?)\]\]/g,'<span class="gap">______</span>');
  let F,B;
  if(cardDir==="en"){
    F=`<div class="fc-w">${esc(w)}</div>${sayBtn}<div class="fc-h">Нажмите, чтобы перевернуть</div>`;
    B=`<div class="fc-t">${esc(t)}</div><div class="fc-e">${gapHtml(e)}</div><div class="fc-h muted">Нажмите на пропуск, чтобы увидеть слово</div>`;
  } else {
    F=`<div class="fc-w" style="font-size:22px">${esc(t)}</div><div class="fc-e" style="color:rgba(255,255,255,.92);margin-top:16px">${blank.replace(/class="gap"/g,'class="gap" style="color:#fff;border-color:#fff"')}</div><div class="fc-h">Вспомните слово и вставьте его в предложение · нажмите, чтобы проверить</div>`;
    B=`<div class="fc-t" style="font-size:24px">${esc(w)}</div><div class="fc-e">${filled}</div><button class="say" style="background:rgba(253,23,150,.12);color:var(--accent)" onclick="event.stopPropagation();say(${JSON.stringify(w).replace(/"/g,"&quot;")})">🔊 Послушать</button>`;
  }
  app.innerHTML = `${backBtn()}
    <div class="muted" style="font-size:13px;font-weight:700">Осталось: ${v.q.length} · выучено за подход: ${v.done}</div>
    <div class="progress"><i style="width:${Math.round(v.done/v.total*100)}%"></i></div>
    <div class="fc ${v.flip?"flip":""}" onclick="flipCard()">
      <div class="fc-in"><div class="fc-f">${F}</div><div class="fc-b">${B}</div></div>
    </div>
    <div class="row2"><button class="btn ghost" onclick="cardAns(false)">Ещё повторить</button><button class="btn" onclick="cardAns(true)">Знаю ✓</button></div>`;
}
function flipCard(){ const v=cur(); v.flip=!v.flip; haptic(); document.querySelector('.fc').classList.toggle('flip'); }
function cardAns(ok){
  const v=cur(), c=v.q.shift(); markActive();
  if(ok){ const k=known(CUR.n,v.level); if(!k.includes(c[0])){k.push(c[0]); store.set(ckey(CUR.n,v.level),k);} v.done++; haptic("success"); }
  else { v.q.splice(Math.min(3,v.q.length),0,c); haptic(); }
  v.flip=false; render();
}
function renderProgress(){
  const s=streak();
  app.innerHTML = `${backBtn()}
    <h2 style="margin-top:0">📈 Мой прогресс</h2>
    <div class="stat">
      <div class="card"><b>${s}</b><span class="muted">🔥 ${s===1?"день":s>1&&s<5?"дня":"дней"} подряд</span></div>
      <div class="card"><b>${totalKnown()}</b><span class="muted">слов выучено</span></div>
      <div class="card"><b>${weeksDone()}</b><span class="muted">недель пройдено</span></div>
    </div>
    <h2>Неделя ${CUR.n}</h2>
    ${LEVELS.map(l=>{const x=CUR.levels[l.id]; if(!x) return ""; const k=known(CUR.n,l.id).length;
      return `<div class="card"><span class="tag" style="background:${l.color};color:${l.fg}">${esc(l.name)}</span><b>${esc(x.title)}</b>
        <div class="progress" style="margin:10px 0 4px"><i style="width:${Math.round(k/x.words.length*100)}%"></i></div>
        <span class="muted" style="font-size:13px">Выучено ${k} из ${x.words.length} слов</span></div>`;}).join("")}
    <p class="muted" style="font-size:13px;text-align:center">Серия растёт, когда вы тренируете карточки каждый день 💪</p>
    <button class="btn" onclick="go({name:'cardsLv'})">Учить слова</button>`;
}

/* ---------- Тест ---------- */
function startTest(){
  // перемешиваем варианты ответов в каждом вопросе и добавляем «Не знаю»
  const items = LEVEL_TEST.map(it=>{
    const idx = it.o.map((_,k)=>k).sort(()=>Math.random()-.5);
    return {lv:it.lv, q:it.q, o:[...idx.map(k=>it.o[k]), DONT_KNOW], a:idx.indexOf(it.a)};
  });
  go({name:"quiz", i:0, score:0, items});
}
function renderQuiz(v){
  if(v.i >= v.items.length) return renderResult(v);
  const item = v.items[v.i];
  app.innerHTML = `${backBtn()}
    <div class="muted" style="font-size:13px;font-weight:700">Вопрос ${v.i+1} из ${v.items.length}</div>
    <div class="progress"><i style="width:${Math.round(v.i/v.items.length*100)}%"></i></div>
    <div class="q">${esc(item.q)}</div>
    ${item.o.map((o,k)=>`<button class="opt" ${o===DONT_KNOW?'style="color:var(--muted);border-style:dashed"':""} onclick="answer(${k})">${esc(o)}</button>`).join("")}
    <button class="back" style="display:block;margin:18px auto 0;font-size:14px" onclick="stack.pop();startTest()">🔄 Начать тест заново</button>`;
}
function resetTest(){ store.set("level",null); store.set("track",null); stack.length=1; startTest(); }
function answer(k){ const v=cur(); const it=v.items[v.i]; v.byLv=v.byLv||{}; const b=v.byLv[it.lv]=v.byLv[it.lv]||[0,0]; b[1]++; if(k===it.a){ v.score++; b[0]++; } haptic(); v.i++; render(); window.scrollTo(0,0); }
function renderResult(v){
  const ORDER=["A1","A2","B1","B2","C1","C2"], by=v.byLv||{};
  const pct = l => { const [ok,n]=by[l]||[0,0]; return n?ok/n:0; };
  let track;
  if (pct("B1") < 0.7) track="1";          // B1 не пройден → A2+ – B1
  else if (pct("B2") < 0.5) track="2";     // B1 пройден, B2 меньше половины → B1+ – B2
  else track="3";                           // B2 половина и больше → B2+ – C1
  const L = lvl(track);
  const TXT = {
    "1": ["Ваша группа материалов — A2+ – B1", pct("A2")<0.5 ? "Начнём с основ: материалы A2+ – B1 помогут уверенно заговорить. Пересматривайте видео и учите карточки каждый день — прогресс придёт быстро." : "Хорошая база! Материалы A2+ – B1 помогут закрепить грамматику и заговорить увереннее."],
    "2": ["Ваша группа материалов — B1+ – B2", "Вы уже общаетесь на бытовые темы. Материалы B1+ – B2 помогут говорить свободно, без пауз и ошибок."],
    "3": ["Ваша группа материалов — B2+ – C1", pct("C1")>=0.7 ? "Впечатляет! Материалы B2+ – C1 и разговорный клуб отшлифуют ваш английский до уровня носителя." : "Отличный уровень! Материалы B2+ – C1 добавят продвинутую лексику, идиомы и естественность речи."]
  }[track];
  store.set("level", L.name); store.set("track", track);
  haptic("success");
  const bars = ORDER.map(l=>{ const [ok,n]=by[l]||[0,0]; const p=n?Math.round(ok/n*100):0;
    return `<div style="display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px"><b style="width:26px">${l}</b><div class="progress" style="flex:1;margin:0"><i style="width:${p}%"></i></div><span class="muted" style="width:44px;text-align:right">${ok}/${n}</span></div>`;}).join("");
  app.innerHTML = `<div class="card result">
      <div class="muted" style="font-weight:700">Ваш уровень</div>
      <div class="level" style="font-size:52px">${esc(L.name)}</div>
      <p class="muted" style="margin-top:8px">${v.score} из ${v.items.length} правильных</p>
      <p>${esc(TXT[1])}</p>
      <div style="text-align:left;margin-top:12px">${bars}</div>
    </div>
    <button class="btn" onclick="stack.length=1;go({name:'levels'});go({name:'topics',level:'${track}'})">Мои материалы: ${esc(L.name)} →</button>
    <button class="btn dark" onclick="stack.length=1;go({name:'club'})">Разговорный клуб ${esc(CLUB.name)}</button>
    <button class="btn ghost" onclick="shareResult('${L.name}')">Поделиться результатом</button>
    <button class="btn ghost" onclick="resetTest()">🔄 Сбросить результат и пройти заново</button>
    <button class="back" style="display:block;margin:16px auto 0" onclick="home()">В главное меню</button>`;
}
function shareResult(level){
  const text = `Мой уровень английского — ${level}! Проверь свой 🎯`;
  const url = "https://t.me/share/url?url="+encodeURIComponent(CONFIG.shareLink)+"&text="+encodeURIComponent(text);
  try{ if(inTelegram){ tg.openTelegramLink(url); return; } }catch(e){}
  window.open(url,"_blank");
}

/* ---------- Загрузка материалов из Google-таблицы (если указана) ---------- */
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'&&t[i+1]==='"'){f+='"';i++;} else if(c==='"') q=false; else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f="";}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }
  if(f||row.length){row.push(f);rows.push(row);}
  return rows;
}
function normLevel(s){ s=String(s).trim(); if(/^[123]$/.test(s)) return s;
  const u=s.toUpperCase().replace(/\s/g,""); if(u.startsWith("A2")) return "1"; if(u.startsWith("B1")) return "2"; if(u.startsWith("B2")) return "3"; return ""; }
async function loadSheet(){
  if(!CONFIG.sheetCsvUrl) return;
  try{
    const r = await fetch(CONFIG.sheetCsvUrl, {cache:"no-store"}); if(!r.ok) return;
    const rows = parseCSV(await r.text()); const h = rows.shift().map(x=>x.trim().toLowerCase());
    const col = n => h.indexOf(n);
    const data = rows.map(r=>({level:normLevel(r[col("level")]), topic:(r[col("topic")]||"").trim(),
      title:(r[col("title")]||"").trim(), link:(r[col("link")]||"").trim(), date:(r[col("date")]||"").trim(),
      format:(col("format")>=0?(r[col("format")]||""):"").trim()}))
      .filter(m=>m.level && m.topic && m.title);
    if(data.length){ MATERIALS = data; render(); }
  }catch(e){}
}


async function loadCards(){
  if(!CONFIG.cardsCsvUrl) return;
  try{
    const r = await fetch(CONFIG.cardsCsvUrl, {cache:"no-store"}); if(!r.ok) return;
    const rows = parseCSV(await r.text()); const h = rows.shift().map(x=>x.trim().toLowerCase()); const c=n=>h.indexOf(n);
    const W={};
    rows.forEach(r=>{ const wk=parseInt(r[c("week")]); const lv=normLevel(r[c("level")]); const word=(r[c("word")]||"").trim();
      if(!wk||!lv||!word) return;
      W[wk]=W[wk]||{n:wk,levels:{}}; const L=W[wk].levels[lv]=W[wk].levels[lv]||{title:(r[c("video")]||"").trim(),p1:0,words:[]};
      if(String(r[c("part")]).trim()==="1") L.p1++;
      L.words.push([word,(r[c("translation")]||"").trim(),(r[c("example")]||"").trim()]); });
    const list=Object.values(W).sort((a,b)=>a.n-b.n);
    if(list.length){ WEEKS=list; CUR=WEEKS[WEEKS.length-1]; render(); }
  }catch(e){}
}

function normDate(v){ v=String(v||"").trim(); let m;
  if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
  if(/^\d{5}$/.test(v)){ const t=new Date(Date.UTC(1899,11,30)+(+v)*864e5); return t.toISOString().slice(0,10); }
  if((m=v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/))) return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  return ""; }
async function loadParts(){
  if(!CONFIG.partsCsvUrl) return;
  try{
    const r = await fetch(CONFIG.partsCsvUrl, {cache:"no-store"}); if(!r.ok) return;
    const rows = parseCSV(await r.text()); const h = rows.shift().map(x=>x.trim().toLowerCase()); const c=n=>h.indexOf(n);
    const data = rows.map(r=>({level:normLevel(r[c("level")]), title:(r[c("title")]||"").trim(), part:parseInt(r[c("part")]),
      date:normDate(r[c("date")]), link:(r[c("link")]||"").trim()})).filter(x=>x.level && x.title && x.part);
    if(data.length){ PARTS = data; render(); }
  }catch(e){}
}
stack.push({name:"home"});
/* deep link: t.me/TerrificCommunityBot/app?startapp=cards_2 → сразу карточки уровня; fresh_2 → «Новое за неделю» уровня */
(function(){
  let sp=""; try{ sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get("startapp")||""; }catch(e){}
  let m;
  if((m=sp.match(/^cards_([123])$/))){ stack.push({name:"cardsLv"}); stack.push({name:"cardsMode",level:m[1]}); }
  else if((m=sp.match(/^fresh_([123])$/))){ stack.push({name:"fresh",lv:m[1]}); }
})();
render(); loadSheet(); loadCards(); loadParts();
</script>
